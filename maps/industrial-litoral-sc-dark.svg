      <stop offset="0" stop-color="#17365b"/>
      <stop offset="1" stop-color="#112b49"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07182e"/>
      <stop offset="1" stop-color="#0b2340"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#sea)"/>
  <g fill="none" stroke="#2a4b70" stroke-width="2" opacity=".45">
