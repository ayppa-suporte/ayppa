<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Litoral de Santa Catarina — mapa esquemático</title>
  <desc id="desc">Representação escura e aproximada do litoral. Os pontos são centros municipais, não endereços de imóveis.</desc>
  <defs>
